name: Daily AI News Digest

on:
  schedule:
    # 北京时间每天 00:07，避开整点高峰。
    - cron: "7 16 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/daily-digest.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取和评估，不发送飞书消息"
        required: true
        default: false
        type: boolean

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare logs directory
        run: mkdir -p logs

      - name: Validate runtime configuration
        run: |
          python - <<'PY'
          import os
          from src.config import load_config, validate_runtime_config

          config = load_config(".")
          validate_runtime_config(
              config,
              publish=os.environ.get("DRY_RUN", "false").lower() != "true",
          )
          print(f"Configuration valid. Provider: {config.ai.get('provider', 'deepseek')}")
          PY

      - name: Run daily digest
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            python run_once.py --dry-run
          else
            python run_once.py
          fi

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          echo "## 每日 AI 新闻" >> "$GITHUB_STEP_SUMMARY"
          summary="$(grep -h 'RUN_SUMMARY ' logs/*.log 2>/dev/null | tail -n 1 || true)"
          if [ -n "$summary" ]; then
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次运行未产生汇总日志，请查看失败步骤。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
